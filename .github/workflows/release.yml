name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release git tag, without "v" prefix (e.g. 1.0.1)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:6.2-jammy
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: swift build -c release --static-swift-stdlib
      - run: swift test
      - run: tar czf swift-a11y-linter-linux-x86_64.tar.gz -C .build/release swift-a11y-linter
      - run: apt-get update -qq && apt-get install -y -qq gh
      - run: gh release upload "$TAG" swift-a11y-linter-linux-x86_64.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - run: swift build -c release --arch arm64 --arch x86_64
      - run: tar czf swift-a11y-linter-macos-universal.tar.gz -C "$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)" swift-a11y-linter
      - run: gh release upload "$TAG" swift-a11y-linter-macos-universal.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
